"$schema" = 'https://starship.rs/config-schema.json'

format = """
$shell\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

[directory]
style = "blue"

[character]
success_symbol = '[λ](bold 195)'
error_symbol = '[λ](bold 210)'

[git_branch]
format = "[$branch]($style)"
style = "fg:11"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](9) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[shell]
disabled = false
bash_indicator = "💩"
fish_indicator = "🐟"
zsh_indicator = "👾"
nu_indicator = "🍂"
format = "[{$indicator}]($style) "
