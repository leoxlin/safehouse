"$schema" = 'https://starship.rs/config-schema.json'

format = """
$shell\
${custom.directory}\
${custom.worktree}\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

[character]
success_symbol = '[λ](bold 195)'
error_symbol = '[λ](bold 210)'

# Normal tree (and non-git dirs): show the repo-relative path, like the
# built-in directory module. Hidden inside a worktree (see custom.worktree).
[custom.directory]
description = "Repo-relative path, except inside a git worktree"
when = 'test "$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)" = "$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)"'
command = '''
top=$(git rev-parse --show-toplevel 2>/dev/null)
if [ -n "$top" ]; then
  pre=$(git rev-parse --show-prefix 2>/dev/null)
  printf '%s' "$(basename "$top")${pre:+/${pre%/}}"
else
  printf '%s' "${PWD/#$HOME/~}" | awk -F/ '{s=(NF>3)?NF-2:1; for(i=s;i<=NF;i++) printf "%s%s", (i>s?"/":""), $i}'
fi
'''
format = "[$output]($style) "
style = "blue"

# Inside a worktree: hide the worktree folder, show "(w) <main repo name>".
[custom.worktree]
description = "Show (w) repo_name when inside a git worktree"
when = 'test "$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)" != "$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)"'
command = 'printf "(w) %s" "$(basename "$(git worktree list | head -1 | awk "{print \$1}")")"'
format = "[$output]($style) "
style = "fg:13"

[git_branch]
format = "[$branch]($style)"
style = "fg:11"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](9) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[shell]
disabled = false
bash_indicator = "💩"
fish_indicator = "🐟"
zsh_indicator = "👾"
nu_indicator = "🍂"
format = "[{$indicator}]($style) "
