system_folders:
  - Inbox
  - Archive
  - Drafts
  - Sent
  - Spam
  - Trash

age_thresholds:
  categorize_days: 1
  mark_read_days: 7
  archive_days: 14

folders:
  Read:
    description: >
      Unread emails I should prioritize reading. Human emails, whitelisted
      senders, important.
    emails:
      - thedartmouthgroup.com
  Compost:
    description: >
      Emails I don't care about reading. Newsletters, automated updates,
      marketing.
    emails: []
  Keep:
    description: >
      Emails I probably want to keep but not read. Financial statements,
      receipts, travel confirmations.
    emails: []
